name: Verify and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tunnel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race ./... -count=3 -timeout=120s
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: CC=gcc go test -race ./... -count=3 -timeout=120s
      - run: go test ./internal/tunnel -run '^$' -bench . -benchmem
      - if: runner.os == 'Linux'
        run: go test ./internal/tunnel -run '^$' -fuzz FuzzFrame -fuzztime=30s
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Version
        run: |
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - run: node scripts/build.cjs
      - run: node scripts/package-release.cjs
      - name: Publish new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Version already published; assets unchanged.'
          else
            gh release create "v$RELEASE_VERSION" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Battly Tunnel $RELEASE_VERSION" --generate-notes
          fi
